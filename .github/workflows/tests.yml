name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '${{ matrix.python-version }}' }
      - name: System libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Calculation and workspace tests
        run: python3 tests/test_core.py && python3 tests/test_migration.py
      - name: GUI smoke test (offscreen)
        run: QT_QPA_PLATFORM=offscreen python3 tests/test_gui.py
      - name: GUI interaction test (3D drag, chart hover)
        run: |
          set -o pipefail
          QT_QPA_PLATFORM=offscreen python3 -X faulthandler tests/test_interaction.py 2>&1 | tee interaction.log
      - name: Screenshot 1 (temporary review aid)
        if: always()
        continue-on-error: true
        run: QT_QPA_PLATFORM=offscreen python3 tests/ci_screens.py ${{ fromJSON('{"3.10":["seals","seals","seals"],"3.11":["conduit","conduit","conduit"],"3.12":["line","line","line"]}')[matrix.python-version][0] }}
      - name: Screenshot 2 (temporary review aid)
        if: false
        continue-on-error: true
        run: QT_QPA_PLATFORM=offscreen python3 tests/ci_screens.py ${{ fromJSON('{"3.10":["seals","seals","seals"],"3.11":["conduit","conduit","conduit"],"3.12":["line","line","line"]}')[matrix.python-version][1] }}
      - name: Screenshot 3 (temporary review aid)
        if: false
        continue-on-error: true
        run: QT_QPA_PLATFORM=offscreen python3 tests/ci_screens.py ${{ fromJSON('{"3.10":["seals","seals","seals"],"3.11":["conduit","conduit","conduit"],"3.12":["line","line","line"]}')[matrix.python-version][2] }}
      - name: Report interaction failure
        if: failure()
        run: |
          python3 - <<'PY'
          import os
          text = open('interaction.log', errors='replace').read()[-6000:] if os.path.exists('interaction.log') else 'no log'
          print('::error title=interaction test::' + text.replace('%', '%25').replace('\r', '').replace('\n', '%0A'))
          PY
