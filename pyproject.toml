[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "caldera"
dynamic = ["version"]
description = "Offline engineering calculation workbench for hydraulic, pneumatic, mechanical and electrical work"
readme = "README.md"
license = { text = "GPL-3.0-only" }
authors = [{ name = "Nate Robertson" }]
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5,<6.12",
    "reportlab>=4,<5",
    "openpyxl>=3.1,<4",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Manufacturing",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/nrobertson152/caldera"
Issues = "https://github.com/nrobertson152/caldera/issues"
Releases = "https://github.com/nrobertson152/caldera/releases"

[project.gui-scripts]
caldera = "caldera.app:main"

[tool.setuptools]
packages = ["caldera", "caldera.ui"]

[tool.setuptools.package-data]
caldera = ["assets/*", "assets/fonts/*"]

[tool.setuptools.dynamic]
version = { attr = "caldera.__version__" }
