name: Build release (AppImage + Windows .exe)
on:
  push:
    tags: ['v*']
  workflow_dispatch:
  pull_request:
    paths: ['packaging/**', '.github/workflows/release.yml', 'requirements.txt']
permissions:
  contents: write
jobs:
  appimage:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: System libraries Qt needs
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libfuse2
      - name: Install Python packages
        run: pip install -r requirements.txt
      - name: Test
        run: python3 tests/test_core.py && python3 tests/test_migration.py
      - name: Build
        run: bash packaging/build_appimage.sh
      - uses: actions/upload-artifact@v4
        with: { name: Caldera-AppImage, path: dist/*.AppImage }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.AppImage }

  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Python packages
        run: pip install -r requirements.txt pyinstaller pillow
      - name: Test
        run: python tests/test_core.py; if ($LASTEXITCODE) { exit 1 }; python tests/test_migration.py
      - name: Build
        run: python packaging/build_windows.py
      - name: Smoke test (the .exe must start and stay running)
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist\*.exe | Select-Object -First 1
          $env:QT_QPA_PLATFORM = 'offscreen'
          $env:CALDERA_DATA = Join-Path $env:RUNNER_TEMP 'caldera-smoke'
          $p = Start-Process -FilePath $exe.FullName -PassThru
          Start-Sleep -Seconds 25
          if ($p.HasExited) { Write-Error "Caldera exited early with code $($p.ExitCode)"; exit 1 }
          Stop-Process -Id $p.Id -Force
          if (-not (Test-Path (Join-Path $env:CALDERA_DATA 'workspace.json'))) { Write-Host 'note: no workspace written yet' }
          Write-Host "OK: $($exe.Name) started and ran for 25 s"
      - uses: actions/upload-artifact@v4
        with: { name: Caldera-Windows, path: dist/*.exe }
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with: { files: dist/*.exe }
